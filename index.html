<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flavio Furtado — Valor & Percepção</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&family=Playfair+Display:ital,wght@1,300&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    :root { --bg: #030303; --fg: #ffffff; }
    body { background-color: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; cursor: none; }

    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    #cursor { position: fixed; width: 8px; height: 8px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; }
    #cursor-follower { 
      position: fixed; width: 40px; height: 40px; border: 1px solid white; border-radius: 50%; pointer-events: none; z-index: 9998; mix-blend-mode: difference;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    .giant-title { font-size: clamp(3rem, 12vw, 18rem); font-weight: 900; line-height: 0.8; letter-spacing: -0.06em; text-transform: uppercase; }
    .serif-italic { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 300; text-transform: lowercase; }

    .mask-v { clip-path: inset(100% 0 0 0); display: block; }
    .mask-h { clip-path: inset(0 100% 0 0); display: block; }

    section { position: relative; width: 100%; min-height: 100vh; z-index: 10; display: flex; flex-direction: column; justify-content: center; padding: 15vh 8vw; mix-blend-mode: exclusion; border-bottom: 1px solid rgba(255,255,255,0.05); }
    
    .tag { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.6em; opacity: 0.5; margin-bottom: 1.5rem; display: block; }
    
    .img-box { position: relative; width: 100%; height: 70vh; overflow: hidden; background: #111; margin: 3rem 0; clip-path: inset(0 100% 0 0); border-radius: 2px; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transform: scale(1.1); transition: transform 0.8s ease; }

    .section-link {
      display: inline-flex; align-items: center; gap: 1rem; margin-top: 1rem; padding: 1rem 2.5rem;
      border: 1px solid rgba(255,255,255,0.3); font-size: 11px; font-weight: 900; letter-spacing: 0.3em;
      text-transform: uppercase; transition: all 0.4s ease; background: rgba(255,255,255,0.05); backdrop-filter: blur(5px);
    }
    .section-link:hover { background: white; color: black; padding-left: 3.5rem; }

    #progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: #fff; width: 0%; z-index: 1000; }
  </style>
</head>
<body>

  <div id="progress-bar"></div>
  <div id="cursor"></div>
  <div id="cursor-follower"></div>
  <div id="canvas-container"></div>

  <header class="fixed top-0 left-0 w-full p-8 z-[100] flex justify-between items-start mix-blend-difference">
    <div class="font-black text-xl tracking-tighter">FLÁVIO FURTADO</div>
    <nav class="flex flex-col gap-2 text-right text-[10px] font-black uppercase tracking-widest opacity-60">
      <a href="#hero" class="hover:opacity-100">Valor</a>
      <a href="#games" class="hover:opacity-100">Projetos</a>
      <a href="#about" class="hover:opacity-100">Perfil</a>
    </nav>
  </header>

  <main>
    <section id="hero">
      <span class="tag">EU CRIO</span>
      <div class="mask-v"><h1 class="giant-title">VALOR</h1></div>
      <div class="mask-h"><h1 class="giant-title serif-italic">& percepção</h1></div>
      <div class="mt-12 max-w-lg">
        <p class="text-[11px] opacity-60 uppercase tracking-[0.4em] leading-relaxed">Onde a estética encontra a substância.</p>
        <a href="#about" class="section-link">Descobrir Visão</a>
      </div>
    </section>

    <section id="awards">
      <span class="tag">Reconhecimentos:</span>
      <div class="img-box">
        <img src="https://raw.githubusercontent.com/flavioparah/flavio-furtado-portfolio/main/awards.png" alt="Awards">
      </div>
      <div class="mask-v"><h2 class="text-6xl md:text-[8vw] font-black">AWARDS</h2></div>
    </section>

    <section id="games">
      <span class="tag">Mundos Interactivos:</span>
      <div class="img-box">
        <img src="https://raw.githubusercontent.com/flavioparah/flavio-furtado-portfolio/main/staying-the-game.gif" alt="Games">
      </div>
      <div class="mask-h"><h2 class="giant-title">GAMES</h2></div>
    </section>

    <section id="about">
      <span class="tag">Perfil</span>
      <div class="grid grid-cols-12 gap-10">
        <div class="col-span-12 lg:col-span-7">
          <div class="mask-v"><h2 class="text-6xl font-black mb-8">DIREÇÃO CRIATIVA<br>& INOVAÇÃO</h2></div>
          <p class="text-lg opacity-60 font-light">Empreendedor focado em IA e Web3.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const lenis = new Lenis({ duration: 1.4 });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);

    const cursor = document.getElementById('cursor');
    const follower = document.getElementById('cursor-follower');
    window.addEventListener('mousemove', (e) => {
      gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0 });
      gsap.to(follower, { x: e.clientX - 20, y: e.clientY - 20, duration: 0.15 });
    });

    // 3. Three.js - Configuração Imersiva
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Objeto 3D maior para garantir que ele nunca saia da tela
    const geometry = new THREE.TorusKnotGeometry(15, 4, 180, 24);
    const material = new THREE.MeshNormalMaterial({ wireframe: true, transparent: true, opacity: 0.18 });
    const torus = new THREE.Mesh(geometry, material);
    scene.add(torus);

    // Começa MAIS PRÓXIMO para envolver o site desde o início
    camera.position.z = 25; 

    gsap.registerPlugin(ScrollTrigger);

    // Timeline do Passeio 3D
    const tl3d = gsap.timeline({
      scrollTrigger: {
        trigger: "body",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.5 // Suavidade maior no arraste
      }
    });

    // Câmera avança mas para antes de perder o objeto de vista
    // Rotação em múltiplos eixos para manter o objeto "vivo" na tela
    tl3d.to(camera.position, { 
      z: -10, 
      ease: "power1.inOut" 
    })
    .to(torus.rotation, { 
      z: Math.PI * 2, 
      x: Math.PI * 1.5,
      y: Math.PI,
      ease: "none" 
    }, 0);

    // Animações de Interface
    gsap.utils.toArray('.img-box').forEach(box => {
      gsap.to(box, { clipPath: 'inset(0 0% 0 0)', scrollTrigger: { trigger: box, start: 'top 85%', end: 'top 40%', scrub: 1 } });
    });

    gsap.utils.toArray('.mask-v, .mask-h').forEach(el => {
      gsap.to(el, { 
        clipPath: el.classList.contains('mask-v') ? 'inset(0% 0 0 0)' : 'inset(0 0% 0 0)', 
        scrollTrigger: { trigger: el, start: 'top 95%', end: 'top 75%', scrub: 0.5 } 
      });
    });

    function animate() {
      // Rotação de base sutil
      torus.rotation.y += 0.002; 
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
