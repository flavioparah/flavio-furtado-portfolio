<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT IT UP | Arcade Retro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --bg-dark: #0d0221;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Efeito de Scanlines CRT */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 20;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }

        .heading-font { font-family: 'Orbitron', sans-serif; }
        
        .game-screen-wrapper {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 960px;
            height: 580px;
            background: #000;
            border: 14px solid #2d0a4e;
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.3), inset 0 0 30px rgba(0, 255, 255, 0.2);
            pointer-events: all;
            z-index: 5;
            border-radius: 6px;
            overflow: hidden;
        }

        /* PAINEL COM TEXTURA DE PLÁSTICO */
        .control-deck {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1020px;
            height: 180px;
            /* Gradiente que simula a curvatura do plástico e brilho */
            background: linear-gradient(180deg, #2a154d 0%, #1a0b2e 15%, #0f051a 100%);
            border-top: 4px solid #3d206b;
            border-left: 2px solid #3d206b;
            border-right: 2px solid #3d206b;
            z-index: 15;
            pointer-events: all;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8), inset 0 2px 10px rgba(255, 255, 255, 0.05);
            border-radius: 20px 20px 0 0; /* Bordas arredondadas de moldagem de plástico */
        }

        /* Camada de grão para simular plástico poroso */
        .control-deck::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            mix-blend-mode: overlay;
            border-radius: 20px 20px 0 0;
        }

        .joystick-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .buttons-grid {
            display: flex;
            gap: 20px;
        }

        .arcade-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.4rem;
            transition: all 0.1s;
            cursor: pointer;
            /* Aspeto de botão plástico brilhante */
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.6), inset 0 -4px 6px rgba(0,0,0,0.3), inset 0 4px 6px rgba(255,255,255,0.2);
        }

        .btn-cyan { background: linear-gradient(145deg, #00aaaa, #007777); color: #fff; border-color: var(--neon-blue); }
        .btn-pink { background: linear-gradient(145deg, #aa00aa, #770077); color: #fff; border-color: var(--neon-pink); }

        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .label-neon {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            text-transform: uppercase;
        }

        .pc-instruction {
            text-align: center;
            border: 2px solid rgba(0, 255, 255, 0.1);
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        @media (max-width: 1100px) {
            .game-screen-wrapper { transform: translate(-50%, -50%) scale(0.8); }
            .control-deck { transform: translateX(-50%) scale(0.8); bottom: -20px; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="ui-overlay">
        <header class="flex justify-between items-start">
            <div>
                <h1 class="heading-font text-5xl font-black italic text-pink-500" style="text-shadow: 4px 4px 0px var(--neon-blue)">BEAT IT UP</h1>
                <p class="label-neon mt-1">DOWNTOWN RETRO TERMINAL</p>
            </div>
            <div class="text-right">
                <div class="label-neon text-yellow-400 animate-pulse text-lg">FREE PLAY</div>
                <p class="text-[10px] text-gray-500 uppercase mt-1">CPU OVERCLOCK ACTIVE // 199X</p>
            </div>
        </header>

        <div class="control-deck">
            <div class="joystick-area">
                <div class="buttons-grid">
                    <div class="arcade-btn btn-cyan" id="key-left">←</div>
                    <div class="arcade-btn btn-pink" id="key-up">↑</div>
                    <div class="arcade-btn btn-cyan" id="key-right">→</div>
                </div>
                <span class="label-neon">BOTÕES DE ATAQUE</span>
            </div>

            <div class="pc-instruction">
                <p class="heading-font text-[12px] text-yellow-400 mb-2">MODO COMPUTADOR</p>
                <p class="text-[13px] text-gray-200 leading-tight">
                    USA AS <span class="text-white font-bold">SETAS DO TECLADO</span><br>
                    GOLPEIA NO <span class="text-pink-500 font-bold">RITMO DA MÚSICA</span>
                </p>
            </div>

            <div class="flex flex-col items-center gap-2 relative z-10">
                <div class="w-14 h-14 rounded-full border-2 border-white/20 flex items-center justify-center text-[10px] text-white/40 font-bold bg-black/40 shadow-inner">START</div>
                <span class="label-neon">PLAYER 1</span>
            </div>
        </div>
    </div>

    <div class="game-screen-wrapper">
        <iframe 
            src="https://itch.io/embed-upload/14977764?color=333333" 
            frameborder="0" 
            style="width: 100%; height: 100%;"
            allowfullscreen=""
            allow="autoplay; fullscreen; keyboard"
        >
            <a href="https://parampara.itch.io/beatitup">Play Beat it up! on itch.io</a>
        </iframe>
    </div>

    <script>
        let scene, camera, renderer;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 10, 115);
            camera.lookAt(0, 10, 0);

            // Iluminação para realçar o material plástico (especularidade)
            const ambientLight = new THREE.AmbientLight(0x200b3b, 1.2);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xffaa00, 2.5, 200);
            sunLight.position.set(0, 80, -60);
            scene.add(sunLight);

            // Luzes de destaque lateral (Rim lights)
            const pinkLight = new THREE.PointLight(0xff00ff, 3, 120);
            pinkLight.position.set(-70, 30, 50);
            scene.add(pinkLight);

            const blueLight = new THREE.PointLight(0x00ffff, 3, 120);
            blueLight.position.set(70, 30, 50);
            scene.add(blueLight);

            const gridHelper = new THREE.GridHelper(1000, 40, 0xff00ff, 0x440044);
            gridHelper.position.y = -50;
            scene.add(gridHelper);

            const arcadeGroup = new THREE.Group();
            
            // Material plástico: Shininess alto e cor escura
            const plasticMat = new THREE.MeshPhongMaterial({ 
                color: 0x120821, 
                shininess: 80, 
                specular: 0x332244 
            });

            // Estrutura traseira
            const backGeo = new THREE.BoxGeometry(140, 150, 40);
            const back = new THREE.Mesh(backGeo, plasticMat);
            back.position.y = -10;
            back.position.z = -15;
            arcadeGroup.add(back);

            // Marquee (Topo)
            const marqueeGeo = new THREE.BoxGeometry(145, 30, 60);
            const marquee = new THREE.Mesh(marqueeGeo, plasticMat);
            marquee.position.y = 65;
            marquee.position.z = 5;
            arcadeGroup.add(marquee);

            scene.add(arcadeGroup);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x0d0221);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('keydown', (e) => {
                let btnId = "";
                if (e.key === "ArrowLeft") btnId = "key-left";
                if (e.key === "ArrowUp") btnId = "key-up";
                if (e.key === "ArrowRight") btnId = "key-right";
                
                if (btnId) {
                    const btn = document.getElementById(btnId);
                    btn.style.transform = "translateY(4px)";
                    btn.style.filter = "brightness(1.5) contrast(1.2)";
                    setTimeout(() => {
                        btn.style.transform = "translateY(0px)";
                        btn.style.filter = "brightness(1)";
                    }, 100);
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (scene.children[4]) { // arcadeGroup
                scene.children[4].position.y = Math.sin(Date.now() * 0.001) * 0.4;
            }
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
