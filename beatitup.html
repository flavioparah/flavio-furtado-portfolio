<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT IT UP | Arcade Retro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --bg-dark: #0d0221;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Efeito de Scanlines (Linhas de TV antiga para o look retro) */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 20;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .heading-font { font-family: 'Orbitron', sans-serif; }
        
        /* Container do Jogo (O ecrã físico do gabinete) */
        .game-screen-wrapper {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 760px;
            height: 427px;
            background: #000;
            border: 12px solid #2d0a4e;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.2);
            pointer-events: all;
            z-index: 5;
            border-radius: 4px;
        }

        /* Painel de Comandos (Onde ficam os botões e o tutorial) */
        .control-deck {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 820px;
            height: 180px;
            background: #1a0b2e;
            border-top: 4px solid var(--neon-blue);
            border-left: 2px solid var(--neon-blue);
            border-right: 2px solid var(--neon-blue);
            z-index: 15;
            pointer-events: all;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 1rem;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.8);
        }

        .joystick-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .buttons-grid {
            display: flex;
            gap: 20px;
        }

        .arcade-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.1s;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
        }

        .btn-cyan { background: #008888; color: #fff; border-color: var(--neon-blue); box-shadow: 0 6px 0 #005555, 0 0 15px rgba(0, 255, 255, 0.3); }
        .btn-pink { background: #880088; color: #fff; border-color: var(--neon-pink); box-shadow: 0 6px 0 #550055, 0 0 15px rgba(255, 0, 255, 0.3); }

        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }

        .label-neon {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            text-transform: uppercase;
        }

        .pc-instruction {
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="ui-overlay">
        <header class="flex justify-between items-start">
            <div>
                <h1 class="heading-font text-5xl font-black italic text-pink-500" style="text-shadow: 3px 3px 0px var(--neon-blue)">BEAT IT UP</h1>
                <p class="label-neon mt-1">Sintonizado no Ritmo da Cidade</p>
            </div>
            <div class="text-right">
                <div class="label-neon text-yellow-400 animate-pulse">MOEDA INSERIDA: 01</div>
                <p class="text-[10px] text-gray-500 uppercase mt-1">DOWNTOWN TECHNO CITY // 199X</p>
            </div>
        </header>

        <!-- Gabinete: Painel de Controle -->
        <div class="control-deck">
            <div class="joystick-area">
                <div class="buttons-grid">
                    <div class="arcade-btn btn-cyan" id="key-left">←</div>
                    <div class="arcade-btn btn-pink" id="key-up">↑</div>
                    <div class="arcade-btn btn-cyan" id="key-right">→</div>
                </div>
                <span class="label-neon">Comandos de Ataque</span>
            </div>

            <!-- Tutorial para Computador -->
            <div class="pc-instruction">
                <p class="heading-font text-[10px] text-yellow-400 mb-1">INSTRUÇÕES DE COMPUTADOR</p>
                <p class="text-[12px] text-gray-300 leading-tight">
                    PRESSIONA AS <span class="text-white font-bold">SETAS DO TECLADO</span><br>
                    PARA GOLPEAR NO <span class="text-pink-500 font-bold">RITMO</span>
                </p>
            </div>

            <div class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 rounded-full border-2 border-white/20 flex items-center justify-center text-[10px] text-white/40">START</div>
                <span class="label-neon">Insert Coin</span>
            </div>
        </div>
    </div>

    <!-- AREA DO ECRÃ DO JOGO -->
    <div class="game-screen-wrapper">
        <!-- ================================================================= -->
        <!-- COLA O TEU LINK WEGL NO ATRIBUTO 'src' ABAIXO: -->
        <iframe 
            src="<iframe frameborder="0" src="https://itch.io/embed-upload/14977764?color=333333" allowfullscreen="" width="960" height="580"><a href="https://parampara.itch.io/beatitup">Play Beat it up! on itch.io</a></iframe>" 
            frameborder="0" 
            class="w-full h-full"
            allow="autoplay; fullscreen; keyboard"
        ></iframe>
        <!-- ================================================================= -->
    </div>

    <script>
        let scene, camera, renderer;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 15, 100);
            camera.lookAt(0, 10, 0);

            // Luzes inspiradas no pôr-do-sol synthwave das imagens de referência
            const ambientLight = new THREE.AmbientLight(0x200b3b, 1.5);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xffaa00, 3, 200);
            sunLight.position.set(0, 50, -50);
            scene.add(sunLight);

            const pinkLight = new THREE.PointLight(0xff00ff, 2, 100);
            pinkLight.position.set(-40, 20, 30);
            scene.add(pinkLight);

            // Grelha de Chão (Visual Synthwave Retrowave)
            const gridHelper = new THREE.GridHelper(1000, 40, 0xff00ff, 0x440044);
            gridHelper.position.y = -40;
            scene.add(gridHelper);

            // Estrutura 3D do Gabinete Arcade
            const arcadeGroup = new THREE.Group();
            const cabinetMat = new THREE.MeshPhongMaterial({ color: 0x1a0b2e });

            // Parte Traseira do Gabinete
            const backGeo = new THREE.BoxGeometry(120, 140, 40);
            const back = new THREE.Mesh(backGeo, cabinetMat);
            back.position.y = -10;
            back.position.z = -10;
            arcadeGroup.add(back);

            // Marquee (Topo do Gabinete onde costuma estar o nome)
            const marqueeGeo = new THREE.BoxGeometry(122, 20, 50);
            const marquee = new THREE.Mesh(marqueeGeo, cabinetMat);
            marquee.position.y = 60;
            arcadeGroup.add(marquee);

            scene.add(arcadeGroup);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x0d0221);
            document.body.appendChild(renderer.domElement);

            // Event Listeners: Fazem os botões do painel reagirem ao teclado real
            window.addEventListener('keydown', (e) => {
                let btnId = "";
                if (e.key === "ArrowLeft") btnId = "key-left";
                if (e.key === "ArrowUp") btnId = "key-up";
                if (e.key === "ArrowRight") btnId = "key-right";
                
                if (btnId) {
                    const btn = document.getElementById(btnId);
                    btn.style.transform = "translateY(4px)";
                    btn.style.filter = "brightness(1.5)";
                    setTimeout(() => {
                        btn.style.transform = "translateY(0px)";
                        btn.style.filter = "brightness(1)";
                    }, 100);
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            // Faz o gabinete flutuar levemente para dar dinamismo
            if (scene.children[3]) {
                scene.children[3].position.y = Math.sin(Date.now() * 0.001) * 0.5;
            }
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
