<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT IT UP | Arcade Retro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --bg-dark: #050110;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Fundo Animado Ultra Leve com CSS */
        .hyperspace-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #050110 100%);
            z-index: 0;
        }

        .grid-floor {
            position: absolute;
            bottom: 0; width: 100%; height: 50%;
            background-image: 
                linear-gradient(rgba(255, 0, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.2) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: top;
            animation: move-grid 2s linear infinite;
        }

        @keyframes move-grid {
            from { background-position: 0 0; }
            to { background-position: 0 100px; }
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.4;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }

        .game-screen-wrapper {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 6px solid #2d0a4e;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
            pointer-events: all;
            z-index: 5;
            border-radius: 4px;
        }

        .control-deck {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1000px;
            height: 140px;
            background: #120821;
            border-top: 3px solid #3d206b;
            z-index: 15;
            pointer-events: all;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.9);
            border-radius: 15px 15px 0 0;
        }

        .arcade-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
            transition: transform 0.05s;
        }

        .btn-green { background: #008800; color: #fff; border: 3px solid #00ff00; }
        .btn-yellow { background: #888800; color: #fff; border: 3px solid #ffff00; }
        .btn-red { background: #880000; color: #fff; border: 3px solid #ff0000; }

        .btn-active {
            transform: scale(0.9) translateY(4px);
            filter: brightness(1.5);
            box-shadow: 0 0 15px currentColor;
        }

        .label-neon {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .control-deck { height: 100px; }
            .arcade-btn { width: 40px; height: 40px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="hyperspace-bg">
        <div class="grid-floor"></div>
    </div>
    
    <div class="scanlines"></div>

    <div class="ui-overlay">
        <header class="flex justify-between items-start">
            <div class="pointer-events-none">
                <h1 class="font-['Orbitron'] text-3xl font-black italic text-pink-500">BEAT IT UP</h1>
                <p class="label-neon mt-1">Beat em up + Rhythm Game</p>
            </div>
            <div class="text-right">
                <p class="label-neon text-yellow-400">FPS STABLE MODE</p>
            </div>
        </header>

        <div class="control-deck">
            <div class="flex gap-6 md:gap-10">
                <div class="arcade-btn btn-green" id="key-left">←</div>
                <div class="arcade-btn btn-yellow" id="key-up">↑</div>
                <div class="arcade-btn btn-red" id="key-right">→</div>
            </div>
            <div class="hidden md:block text-center opacity-30">
                <p class="text-[11px] uppercase tracking-widest">Ritmo & Porrada</p>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-[8px] text-white/20">START</div>
            </div>
        </div>
    </div>

    <div class="game-screen-wrapper">
        <iframe 
            src="https://itch.io/embed-upload/14977764?color=333333" 
            frameborder="0" 
            style="width: 100%; height: 100%;"
            allow="autoplay; fullscreen; keyboard"
        ></iframe>
    </div>

    <script>
        // Mapeamento de teclas para feedback visual
        const keyMap = {
            "ArrowLeft": "key-left",
            "ArrowUp": "key-up",
            "ArrowRight": "key-right"
        };

        window.addEventListener('keydown', (e) => {
            const id = keyMap[e.key];
            if (id) {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.classList.add('btn-active');
                    setTimeout(() => {
                        btn.classList.remove('btn-active');
                    }, 100);
                }
            }
        });

        // Clique nos botões virtuais (mobile)
        document.querySelectorAll('.arcade-btn').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('btn-active'));
            btn.addEventListener('mouseup', () => btn.classList.remove('btn-active'));
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                btn.classList.add('btn-active');
            });
            btn.addEventListener('touchend', () => btn.classList.remove('btn-active'));
        });
    </script>
</body>
</html>
